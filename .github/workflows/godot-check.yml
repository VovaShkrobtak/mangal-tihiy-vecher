name: Godot project check
on:
  push:
  pull_request:
jobs:
  import-and-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Godot
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.5.1
          use-dotnet: false
      - name: Import assets
        run: godot --headless --editor --path . --quit
      - name: Smoke-test audio and gameplay
        run: godot --headless --path . --script res://tests/smoke_test.gd
